name: Build desktop releases

on:
  push:
    branches:
      - main
      - claude/project-optimization-analysis-k8bkuo
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export Windows, macOS and Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify .NET build
        run: dotnet build "Survivors Starter Kit.csproj" --configuration Release --nologo

      - name: Export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_mono_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Windows Desktop,macOS,Linux/X11
          use_preset_export_path: true
          archive_output: true
          archive_root_folder: true
          cache: true
          verbose: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorsStarterKit-${{ github.sha }}
          path: ${{ steps.export.outputs.archive_directory }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_DIRECTORY: ${{ steps.export.outputs.archive_directory }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE_DIRECTORY"/* --generate-notes
