name: Build desktop releases

on:
  push:
    branches:
      - main
      - claude/project-optimization-analysis-k8bkuo
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export Windows, macOS and Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify .NET build
        run: dotnet build "Survivors Starter Kit.csproj" --configuration Release --nologo

      - name: Export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_mono_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Windows Desktop,macOS,Linux/X11
          use_preset_export_path: true
          archive_output: true
          archive_root_folder: true
          cache: true
          verbose: true

      - name: Split platform packages
        env:
          ARCHIVE_DIRECTORY: ${{ steps.export.outputs.archive_directory }}
          PACKAGE_DIRECTORY: ${{ runner.temp }}/survivors-starter-kit-packages
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_DIRECTORY"
          echo "Archives produced by Godot Export:"
          find "$ARCHIVE_DIRECTORY" -maxdepth 2 -type f -print

          windows_archive="$(find "$ARCHIVE_DIRECTORY" -maxdepth 2 -type f -iname '*windows*' -print -quit)"
          macos_archive="$(find "$ARCHIVE_DIRECTORY" -maxdepth 2 -type f -iname '*macos*' -print -quit)"
          linux_archive="$(find "$ARCHIVE_DIRECTORY" -maxdepth 2 -type f -iname '*linux*' -print -quit)"

          test -n "$windows_archive"
          test -n "$macos_archive"
          test -n "$linux_archive"

          cp "$windows_archive" "$PACKAGE_DIRECTORY/SurvivorsStarterKit-Windows.zip"
          cp "$macos_archive" "$PACKAGE_DIRECTORY/SurvivorsStarterKit-macOS.zip"
          cp "$linux_archive" "$PACKAGE_DIRECTORY/SurvivorsStarterKit-Linux.zip"

          echo "Independent platform packages:"
          ls -lh "$PACKAGE_DIRECTORY"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorsStarterKit-Windows-${{ github.sha }}
          path: ${{ runner.temp }}/survivors-starter-kit-packages/SurvivorsStarterKit-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorsStarterKit-macOS-${{ github.sha }}
          path: ${{ runner.temp }}/survivors-starter-kit-packages/SurvivorsStarterKit-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorsStarterKit-Linux-${{ github.sha }}
          path: ${{ runner.temp }}/survivors-starter-kit-packages/SurvivorsStarterKit-Linux.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ runner.temp }}/survivors-starter-kit-packages
        run: gh release create "$GITHUB_REF_NAME" "$PACKAGE_DIRECTORY"/* --generate-notes
